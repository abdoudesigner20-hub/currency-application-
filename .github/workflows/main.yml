name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04 # تحديد إصدار مستقر من نظام التشغيل

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # تحديث للإصدار الرابع

      - name: Build with Buildozer
        uses: JoshDreamland/buildozer-action@v1.5 # أداة بديلة مستقرة ومحدثة
        with:
          save_buildozer_cache: true
          python_version: 3.10
          buildozer_version: master
          subcommand: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # تحديث للإصدار الرابع
        with:
          name: package
          path: bin/*.apk
          
